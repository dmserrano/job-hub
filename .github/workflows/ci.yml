name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: typecheck · test · build
    runs-on: ubuntu-latest

    # One Postgres instance; the tracker owns its schema (ADR-0003). Integration
    # tests target a disposable tracker_test schema inside this same instance.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobhub
          POSTGRES_PASSWORD: jobhub
          POSTGRES_DB: jobhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhub -d jobhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jobhub:jobhub@localhost:5432/jobhub

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Integration tests
        run: pnpm test

      - name: Build
        run: pnpm build
